<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server & Domain Configuration</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            padding: 24px;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.25rem;
            color: #111827;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 12px;
        }

        .field-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f3f4f6;
        }

        .field-group:last-child {
            border-bottom: none;
        }

        .label {
            font-weight: 600;
            color: #4b5563;
            font-size: 0.95rem;
        }

        .value {
            font-family: monospace;
            background-color: #f9fafb;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #e5e7eb;
            color: #1f2937;
            font-size: 0.95rem;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-left: 4px;
        }

        .badge-http {
            background-color: #fef3c7;
            color: #92400e;
        }

        .badge-https {
            background-color: #d1fae5;
            color: #065f46;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Connection Details</h2>
        
        <div class="field-group">
            <span class="label">Domain</span>
            <span class="value">example</span>
        </div>

        <div class="field-group">
            <span class="label">Port</span>
            <span class="value">1233</span>
        </div>

        <div class="field-group">
            <span class="label">IP Address</span>
            <span class="value">192.168.1.100</span>
        </div>

        <div class="field-group">
            <span class="label">Protocol Setting</span>
            <div>
                <span class="badge badge-http">HTTP</span>
                <span class="badge badge-https">HTTPS</span>
            </div>
        </div>

        <div class="field-group">
            <span class="label">Full URL (HTTP)</span>
            <span class="value">http://example:1233</span>
        </div>

        <div class="field-group">
            <span class="label">Full URL (HTTPS)</span>
            <span class="value">https://example:1233</span>
        </div>
    </div>

</body>
</html>
