<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>easyporn - Loading</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --nav-bg: #0f0f0f;
      --border: #272727;
      --skeleton-base: #202020;
      --skeleton-highlight: #383838;
      --text-main: #f1f1f1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      overflow-x: hidden;
    }

    /* Top Navigation Bar */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 56px;
      padding: 0 1.5rem;
      background-color: var(--nav-bg);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .search-bar-placeholder {
      width: 40%;
      max-width: 600px;
      height: 38px;
      border-radius: 20px;
    }

    .user-avatar-placeholder {
      width: 34px;
      height: 34px;
      border-radius: 50%;
    }

    /* Layout */
    .container {
      display: flex;
      min-height: calc(100vh - 56px);
    }

    /* Sidebar Placeholder */
    aside {
      width: 240px;
      padding: 1rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      border-right: 1px solid var(--border);
    }

    .sidebar-item {
      height: 40px;
      border-radius: 8px;
      width: 100%;
    }

    /* Main Content Area */
    main {
      flex: 1;
      padding: 1.5rem;
    }

    /* Filter Pills Placeholder */
    .filter-bar {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      overflow-x: hidden;
    }

    .filter-chip {
      height: 32px;
      width: 80px;
      border-radius: 8px;
      flex-shrink: 0;
    }

    /* Video Grid */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem 1rem;
    }

    .video-card {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    /* 16:9 Thumbnail Aspect Ratio */
    .thumbnail-placeholder {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
    }

    .video-info {
      display: flex;
      gap: 0.75rem;
    }

    .channel-avatar-placeholder {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .metadata-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .title-placeholder {
      height: 16px;
      border-radius: 4px;
      width: 90%;
    }

    .subtitle-placeholder {
      height: 12px;
      border-radius: 4px;
      width: 60%;
    }

    /* Shimmer Animation */
    .skeleton {
      background: linear-gradient(
        90deg,
        var(--skeleton-base) 25%,
        var(--skeleton-highlight) 50%,
        var(--skeleton-base) 75%
      );
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      0% {
        background-position: 200% 0;
      }
      100% {
        background-position: -200% 0;
      }
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      aside {
        display: none;
      }
      .search-bar-placeholder {
        display: none;
      }
    }
  </style>
</head>
