<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domain Placeholder</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2rem;
    }

    header {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--accent);
      background-color: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 9999px;
    }

    main {
      width: 100%;
      max-width: 640px;
      margin: auto;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 3rem 2rem;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 2.25rem;
      letter-spacing: -0.025em;
      margin-bottom: 1rem;
      word-break: break-all;
    }

    p.lead {
      color: var(--text-muted);
      font-size: 1.125rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .info-box {
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      text-align: left;
      font-size: 0.95rem;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      color: var(--text-muted);
    }

    .info-value {
      font-weight: 500;
    }

    footer {
      width: 100%;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-top: 2rem;
    }
  </style>
</head>
<body>

  <header>
    <span class="badge">Status: Parked</span>
  </header>

  <main>
    <h1 id="domain-name">easyporn</h1>
    <p class="lead">This domain is registered and hosted on this server. No active services or content are currently published here.</p>

    <div class="info-box">
      <div class="info-row">
        <span class="info-label">Domain Name</span>
        <span class="info-value">easyporn</span>
      </div>
      <div class="info-row">
        <span class="info-label">Server Status</span>
        <span class="info-value" style="color: #4ade80;">Active / Ready</span>
      </div>
      <div class="info-row">
        <span class="info-label">Configuration</span>
        <span class="info-value">Default Index Page</span>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Domain Administration. All rights reserved.</p>
  </footer>

</body>
</html>
